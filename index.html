<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Calistenia 12 Semanas</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{--black:#111;--blue:#0B4DA3;--red:#C21807;--gray:#444;--card:#F4F4F4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#fff;color:var(--black);font-family:system-ui,-apple-system,sans-serif;padding-bottom:120px}
  button{font-family:inherit;cursor:pointer}
  .hdr{padding:16px 16px 12px;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;align-items:center}
  .hdr h1{margin:0;font-size:22px;font-weight:900;line-height:1}
  .hdr .sub{font-family:monospace;font-size:12px;color:var(--blue);font-weight:800;margin-top:3px}
  .iconbtn{background:#fff;border:2px solid var(--black);border-radius:999px;width:40px;height:40px;font-size:18px;display:flex;align-items:center;justify-content:center}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
  .badge{padding:4px 14px;border-radius:999px;color:#fff;font-family:monospace;font-size:12px;font-weight:800}
  .cur{font-family:monospace;font-size:11px;font-weight:800;color:var(--red);margin-top:4px;text-align:center}
  .curbtn{background:none;border:none;font-family:monospace;font-size:11px;font-weight:700;color:var(--blue);text-decoration:underline;margin-top:4px;padding:0}
  .list{padding:8px 16px;display:flex;flex-direction:column;gap:12px}
  .ex{background:var(--card);border:2px solid var(--black);border-radius:12px;padding:12px}
  .ex.fin{border:2.5px solid var(--red)}
  .exrow{display:flex;align-items:center;gap:12px}
  .exicon{width:56px;height:56px;flex-shrink:0;background:#fff;border:1.5px solid var(--black);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .ex.fin .exicon{border-color:var(--red)}
  .exname{font-size:15px;font-weight:800}
  .extarget{font-family:monospace;font-size:12px;font-weight:800;color:var(--blue);margin-top:2px}
  .ex.fin .extarget{color:var(--red)}
  .restbtn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 10px;font-family:monospace;font-size:12px;font-weight:800;flex-shrink:0}
  .ex.fin .restbtn{background:var(--red)}
  .sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .setwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
  .setlbl{font-family:monospace;font-size:10px;font-weight:800}
  .setinp{width:44px;height:38px;text-align:center;background:#fff;border:2px solid var(--black);border-radius:6px;font-family:monospace;font-size:15px;font-weight:800;color:var(--black)}
  .divider{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
  .divider div{flex:1;height:2px;background:var(--red)}
  .divider span{font-family:monospace;font-size:12px;font-weight:900;color:var(--red);letter-spacing:1px}
  .actions{display:flex;gap:8px;margin:8px 0 24px}
  .actions button{flex:1;padding:14px;border-radius:12px;font-weight:800;font-size:14px}
  .btn-save{background:#fff;color:var(--black);border:2px solid var(--black)}
  .btn-done{background:var(--blue);color:#fff;border:none}
  .rest-day{background:var(--card);border:2px solid var(--black);border-radius:12px;padding:24px;text-align:center}
  /* timer */
  #timer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--black);display:none;z-index:40}
  #timer.on{display:block}
  #timer.done{animation:flash .5s infinite}
  @keyframes flash{0%,100%{background:var(--red)}50%{background:#fff}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .tclose{display:flex;justify-content:flex-end;padding:2px 10px 0}
  .tclose button{background:none;border:none;font-size:16px;font-weight:800;color:var(--black)}
  .trow{display:flex;align-items:center;gap:12px;padding:4px 12px 12px}
  .tdial{position:relative;width:64px;height:64px;flex-shrink:0}
  .tdial.run{animation:pulse 1s infinite}
  .tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:17px;font-weight:800}
  .tstat{font-family:monospace;font-size:11px;font-weight:800;letter-spacing:1px}
  .tpresets{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .tpresets button{background:#fff;color:var(--black);border:1.5px solid var(--black);border-radius:5px;padding:3px 7px;font-family:monospace;font-size:11px;font-weight:800}
  .tpresets button.sel{background:var(--blue);color:#fff}
  .tctrl{width:46px;height:46px;border-radius:999px;border:none;color:#fff;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .treset{width:40px;height:40px;border-radius:999px;background:#fff;border:1.5px solid var(--black);font-size:16px;flex-shrink:0}
  /* calendar */
  #cal{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column}
  #cal.on{display:flex}
  .calhdr{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:2px solid var(--black)}
  .calhdr h2{margin:0;font-size:20px;font-weight:900}
  .calbody{flex:1;overflow:auto;padding:12px 16px 24px}
  .calphase{font-family:monospace;font-size:12px;font-weight:800;color:var(--blue);margin:12px 0 6px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .calday{aspect-ratio:1;border-radius:5px;background:#fff;border:1.5px solid #999;font-family:monospace;font-size:10px;font-weight:800;color:var(--black);display:flex;align-items:center;justify-content:center}
  .calday.done{color:#fff}
  .calday.cur{border:2.5px solid var(--black)}
  .calday.view{border:3px solid var(--red)}
  .calday.rest{opacity:.45}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1 id="h-day">—</h1>
    <div class="sub" id="h-phase">—</div>
  </div>
  <button class="iconbtn" id="btn-cal">▦</button>
</div>

<div class="nav">
  <button class="iconbtn" id="btn-prev">‹</button>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="badge" id="d-type">—</div>
    <div id="d-cur"></div>
  </div>
  <button class="iconbtn" id="btn-next">›</button>
</div>

<div class="list" id="list"></div>

<div id="timer">
  <div class="tclose"><button id="t-close">✕</button></div>
  <div class="trow">
    <div class="tdial" id="t-dial">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="27" stroke="#CCC" stroke-width="5" fill="none"/>
        <circle id="t-arc" cx="32" cy="32" r="27" stroke="#0B4DA3" stroke-width="5" fill="none"
          stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="169.6" stroke-dashoffset="0"/>
      </svg>
      <div class="tnum" id="t-num">60</div>
    </div>
    <div style="flex:1;min-width:0">
      <div class="tstat" id="t-stat">DESCANSO</div>
      <div class="tpresets" id="t-presets"></div>
    </div>
    <button class="tctrl" id="t-play">▶</button>
    <button class="treset" id="t-reset">↺</button>
  </div>
</div>

<div id="cal">
  <div class="calhdr"><h2>PROGRAMA · 12 SEMANAS</h2><button class="iconbtn" id="cal-close">✕</button></div>
  <div class="calbody" id="cal-body"></div>
</div>

<script src="app.js"></script>
</body>
</html>
